    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/preview proxy
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws:'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && reason.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
