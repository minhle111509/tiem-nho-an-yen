<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8BA7A"/>
      <stop offset="100%" stop-color="#B08D4C"/>
    </linearGradient>
    <linearGradient id="moss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F5547"/>
      <stop offset="100%" stop-color="#28382E"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Zen Enso vibe -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="216" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" fill="none" stroke-dasharray="16 8"/>

  <!-- Incense Smoke Curls rising gently -->
  <path d="M256,120 C240,150 270,175 256,205 C246,225 256,240 256,250" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M276,145 C264,168 286,186 272,210 C264,222 268,235 264,248" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Stylized Minimalist Lotus Flower Petals -->
  <!-- Center Petal (Flame/Bud shape) -->
  <path d="M256,210 C244,250 240,290 256,330 C272,290 268,250 256,210 Z" fill="url(#moss)"/>
  
  <!-- Left Inner Petal -->
  <path d="M250,240 C216,270 200,305 228,335 C244,332 250,305 252,275 Z" fill="url(#moss)" opacity="0.95"/>
  <!-- Right Inner Petal -->
  <path d="M262,240 C296,270 312,305 284,335 C268,332 262,305 260,275 Z" fill="url(#moss)" opacity="0.95"/>

  <!-- Left Outer Gentle Petal -->
  <path d="M236,280 C180,300 160,335 200,356 C225,354 240,335 246,310 Z" fill="url(#moss)" opacity="0.8"/>
  <!-- Right Outer Gentle Petal -->
  <path d="M276,280 C332,300 352,335 312,356 C287,354 272,335 266,310 Z" fill="url(#moss)" opacity="0.8"/>

  <!-- Lotus Base / Water or Zen Platform -->
  <path d="M190,360 C230,378 282,378 322,360 C302,372 210,372 190,360 Z" fill="url(#gold)"/>
  <circle cx="256" cy="385" r="5" fill="url(#gold)"/>

  <!-- Subtle Vietnamese Accent mark or serenity drop -->
  <circle cx="256" cy="100" r="4" fill="url(#gold)"/>
</svg>
